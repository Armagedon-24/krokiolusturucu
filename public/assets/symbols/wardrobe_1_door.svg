<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" />
      <stop offset="100%" stop-color="#d9d9d9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="60" height="60" fill="none" />
  
  <!-- Outer Frame -->
  <rect x="2" y="2" width="56" height="56" fill="url(#frameGrad)" stroke="#111111" stroke-width="2.5" />
  <rect x="5" y="5" width="50" height="50" fill="none" stroke="#333333" stroke-width="1" />
  
  <!-- Hanging Rod -->
  <line x1="5" y1="30" x2="55" y2="30" stroke="#555" stroke-width="3" filter="url(#shadow)" />
  
  <!-- Door (Front) -->
  <rect x="2" y="54" width="56" height="6" fill="url(#frameGrad)" stroke="#111111" stroke-width="1.5" />
  <line x1="44" y1="57" x2="52" y2="57" stroke="#111111" stroke-width="2" /> <!-- Handle -->
</svg>
