  <!-- Hospital H -->
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#000" opacity="0.1">H</text>
  <!-- Windows -->
  <rect x="45" y="70" width="25" height="25" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="130" y="70" width="25" height="25" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="45" y="110" width="25" height="25" fill="none" stroke="#000" stroke-width="1.5"/>
