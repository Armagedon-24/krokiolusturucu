<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Body -->
  <rect x="5" y="5" width="170" height="170" fill="#fcfcfc" stroke="#111111" stroke-width="2" />
  
  <!-- Base/Legs -->
  <rect x="5" y="165" width="170" height="10" fill="#e0e0e0" stroke="#111111" stroke-width="1.5" />
  
  <!-- Top Cornice -->
  <rect x="2" y="5" width="176" height="8" fill="#e0e0e0" stroke="#111111" stroke-width="1.5" />
  
  <!-- Dividers (3 Doors) -->
  <line x1="61.66" y1="13" x2="61.66" y2="165" stroke="#111111" stroke-width="1.5" />
  <line x1="118.33" y1="13" x2="118.33" y2="165" stroke="#111111" stroke-width="1.5" />
  
  <!-- Door Panels (inner frames for realism) -->
  <rect x="12" y="20" width="42.66" height="138" fill="none" stroke="#666666" stroke-width="1" />
  <rect x="68.66" y="20" width="42.66" height="138" fill="none" stroke="#666666" stroke-width="1" />
  <rect x="125.33" y="20" width="42.66" height="138" fill="none" stroke="#666666" stroke-width="1" />
  
  <!-- Handles -->
  <line x1="52" y1="85" x2="52" y2="105" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />
  <line x1="70" y1="85" x2="70" y2="105" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />
  <line x1="127" y1="85" x2="127" y2="105" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />
</svg>
