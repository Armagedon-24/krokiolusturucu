<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="splatterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="80%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <filter id="bloodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#450a0a" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Main pool -->
  <path d="M45 30 C 60 20, 80 35, 70 55 C 85 70, 60 85, 45 75 C 25 85, 10 65, 25 45 C 10 25, 30 20, 45 30 Z" fill="url(#splatterGrad)" filter="url(#bloodGlow)"/>
  
  <!-- Splatters branching out -->
  <path d="M70 55 C 85 50, 95 60, 90 65" stroke="url(#splatterGrad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#bloodGlow)"/>
  <path d="M25 45 C 15 40, 5 30, 10 20" stroke="url(#splatterGrad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#bloodGlow)"/>
  <path d="M45 75 C 50 90, 40 95, 35 90" stroke="url(#splatterGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#bloodGlow)"/>
  <path d="M45 30 C 50 15, 65 5, 75 10" stroke="url(#splatterGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#bloodGlow)"/>

  <!-- High velocity droplets -->
  <circle cx="85" cy="20" r="2.5" fill="url(#splatterGrad)" filter="url(#bloodGlow)"/>
  <circle cx="92" cy="15" r="1.5" fill="url(#splatterGrad)" filter="url(#bloodGlow)"/>
  <circle cx="95" cy="55" r="2" fill="url(#splatterGrad)" filter="url(#bloodGlow)"/>
  <circle cx="15" cy="85" r="3" fill="url(#splatterGrad)" filter="url(#bloodGlow)"/>
  <circle cx="8" cy="90" r="1.5" fill="url(#splatterGrad)" filter="url(#bloodGlow)"/>
  <circle cx="20" cy="10" r="2" fill="url(#splatterGrad)" filter="url(#bloodGlow)"/>
  
  <!-- Wet highlights for realism -->
  <path d="M40 35 C 50 30, 60 40, 55 45" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M30 50 C 35 55, 40 60, 35 65" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.2"/>
</svg>
