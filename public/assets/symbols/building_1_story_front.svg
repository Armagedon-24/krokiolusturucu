<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <!-- Ground Line -->
  <line x1="5" y1="135" x2="195" y2="135" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Foundation Slab -->
  <rect x="25" y="125" width="150" height="10" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Main Building Block -->
  <rect x="30" y="65" width="140" height="60" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Chimney Base -->
  <rect x="45" y="15" width="14" height="25" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Chimney Cap (Stepped) -->
  <rect x="42" y="10" width="20" height="5" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="44" y="5" width="16" height="5" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Roof Fascia (Overhang) -->
  <rect x="20" y="60" width="160" height="5" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Roof (Hipped) -->
  <polygon points="20,60 65,25 135,25 180,60" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Roof Ridge Detail -->
  <line x1="65" y1="25" x2="135" y2="25" stroke="#000" stroke-width="2"/>

  <!-- Stairs (Architectural Step-down) -->
  <rect x="85" y="125" width="30" height="5" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="80" y="130" width="40" height="5" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- Door Frame -->
  <rect x="85" y="70" width="30" height="55" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Door Inner Panel -->
  <rect x="88" y="73" width="24" height="52" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Door Knob -->
  <circle cx="108" cy="100" r="1.5" fill="#000"/>
  <!-- Door Glass/Panel Details -->
  <rect x="91" y="76" width="18" height="15" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="91" y="95" width="18" height="25" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- Left Window -->
  <!-- Outer Window Sill -->
  <rect x="42" y="105" width="28" height="3" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Outer Window Frame -->
  <rect x="44" y="75" width="24" height="30" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Inner Glass Panes -->
  <rect x="46" y="77" width="9" height="26" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="57" y="77" width="9" height="26" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- Right Window -->
  <!-- Outer Window Sill -->
  <rect x="130" y="105" width="28" height="3" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Outer Window Frame -->
  <rect x="132" y="75" width="24" height="30" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Inner Glass Panes -->
  <rect x="134" y="77" width="9" height="26" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="145" y="77" width="9" height="26" fill="none" stroke="#000" stroke-width="1.5"/>
</svg>
