<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Yol (üst geçidin altından geçer) -->
  <rect x="0" y="88" width="200" height="24" fill="#333333" />
  <line x1="0" y1="90" x2="200" y2="90" stroke="white" stroke-width="2.5" />
  <line x1="0" y1="110" x2="200" y2="110" stroke="white" stroke-width="2.5" />
  <line x1="0" y1="100" x2="200" y2="100" stroke="white" stroke-width="2.5" stroke-dasharray="10 8" />

  <!-- Üst geçit güvertesi (yolun üzerinden geçer) -->
  <rect x="88" y="20" width="24" height="160" fill="white" stroke="black" stroke-width="3" />

  <!-- Üst merdiven basamakları -->
  <line x1="89" y1="26" x2="111" y2="26" stroke="black" stroke-width="2" />
  <line x1="89" y1="34" x2="111" y2="34" stroke="black" stroke-width="2" />
  <line x1="89" y1="42" x2="111" y2="42" stroke="black" stroke-width="2" />
  <line x1="89" y1="50" x2="111" y2="50" stroke="black" stroke-width="2" />
  <line x1="89" y1="58" x2="111" y2="58" stroke="black" stroke-width="2" />
  <line x1="89" y1="66" x2="111" y2="66" stroke="black" stroke-width="2" />
  <line x1="89" y1="74" x2="111" y2="74" stroke="black" stroke-width="2" />
  <line x1="89" y1="82" x2="111" y2="82" stroke="black" stroke-width="2" />

  <!-- Alt merdiven basamakları -->
  <line x1="89" y1="118" x2="111" y2="118" stroke="black" stroke-width="2" />
  <line x1="89" y1="126" x2="111" y2="126" stroke="black" stroke-width="2" />
  <line x1="89" y1="134" x2="111" y2="134" stroke="black" stroke-width="2" />
  <line x1="89" y1="142" x2="111" y2="142" stroke="black" stroke-width="2" />
  <line x1="89" y1="150" x2="111" y2="150" stroke="black" stroke-width="2" />
  <line x1="89" y1="158" x2="111" y2="158" stroke="black" stroke-width="2" />
  <line x1="89" y1="166" x2="111" y2="166" stroke="black" stroke-width="2" />
  <line x1="89" y1="174" x2="111" y2="174" stroke="black" stroke-width="2" />

  <!-- Üst merdiven yön oku: aşağıya doğru iner (aynı yön) -->
  <line x1="100" y1="34" x2="100" y2="78" stroke="black" stroke-width="2.5" />
  <path d="M 100 85 L 95.5 74 L 104.5 74 Z" fill="black" />

  <!-- Alt merdiven yön oku: aşağıya doğru iner (aynı yön) -->
  <line x1="100" y1="122" x2="100" y2="166" stroke="black" stroke-width="2.5" />
  <path d="M 100 173 L 95.5 162 L 104.5 162 Z" fill="black" />
</svg>
