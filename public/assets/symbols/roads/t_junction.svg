<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Horizontal Road -->
  <rect x="0" y="60" width="200" height="80" fill="#333333" />
  <line x1="0" y1="62" x2="200" y2="62" stroke="white" stroke-width="4" />
  <line x1="0" y1="138" x2="200" y2="138" stroke="white" stroke-width="4" />
  <line x1="0" y1="100" x2="200" y2="100" stroke="white" stroke-width="4" stroke-dasharray="15 15" />

  <!-- Vertical Road (T branch) -->
  <rect x="60" y="140" width="80" height="60" fill="#333333" />
  <line x1="62" y1="140" x2="62" y2="200" stroke="white" stroke-width="4" />
  <line x1="138" y1="140" x2="138" y2="200" stroke="white" stroke-width="4" />
  <line x1="100" y1="140" x2="100" y2="200" stroke="white" stroke-width="4" stroke-dasharray="15 15" />

  <!-- Asphalt patch to cover the bottom white line of the horizontal road -->
  <rect x="64" y="136" width="72" height="4" fill="#333333" />
</svg>
