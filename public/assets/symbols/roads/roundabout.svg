<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Horizontal Road -->
  <rect x="0" y="60" width="200" height="80" fill="#333333" />
  <line x1="0" y1="62" x2="200" y2="62" stroke="white" stroke-width="4" />
  <line x1="0" y1="138" x2="200" y2="138" stroke="white" stroke-width="4" />
  <line x1="0" y1="100" x2="200" y2="100" stroke="white" stroke-width="4" stroke-dasharray="15 15" />

  <!-- Vertical Road -->
  <rect x="60" y="0" width="80" height="200" fill="#333333" />
  <line x1="62" y1="0" x2="62" y2="200" stroke="white" stroke-width="4" />
  <line x1="138" y1="0" x2="138" y2="200" stroke="white" stroke-width="4" />
  <line x1="100" y1="0" x2="100" y2="200" stroke="white" stroke-width="4" stroke-dasharray="15 15" />

  <!-- Intersection Asphalt Cover -->
  <circle cx="100" cy="100" r="50" fill="#333333" />

  <!-- Roundabout Dashed Line -->
  <circle cx="100" cy="100" r="46" stroke="white" stroke-width="4" stroke-dasharray="12 12" fill="none" />

  <!-- Roundabout Island -->
  <circle cx="100" cy="100" r="30" fill="#22c55e" stroke="white" stroke-width="2" />
</svg>
