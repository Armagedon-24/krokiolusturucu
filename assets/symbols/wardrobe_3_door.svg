<svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" />
      <stop offset="100%" stop-color="#d9d9d9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="180" height="60" fill="none" />
  
  <rect x="2" y="2" width="176" height="56" fill="url(#frameGrad)" stroke="#111111" stroke-width="2.5" />
  <rect x="5" y="5" width="170" height="49" fill="none" stroke="#333333" stroke-width="1" />
  
  <line x1="60" y1="2" x2="60" y2="58" stroke="#111111" stroke-width="2" />
  <line x1="120" y1="2" x2="120" y2="58" stroke="#111111" stroke-width="2" />
  
  <!-- Left Side: Hanging Rod -->
  <g id="left-section">
    <line x1="5" y1="30" x2="59" y2="30" stroke="#555" stroke-width="3" filter="url(#shadow)" />
  </g>
  
  <!-- Middle Side: Shelves -->
  <g id="middle-section">
    <line x1="61" y1="15" x2="119" y2="15" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="61" y1="30" x2="119" y2="30" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="61" y1="45" x2="119" y2="45" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>
  
  <!-- Right Side: Hanging Rod -->
  <g id="right-section">
    <line x1="121" y1="30" x2="175" y2="30" stroke="#555" stroke-width="3" filter="url(#shadow)" />
  </g>
  
  <!-- Doors (Front) -->
  <rect x="2" y="54" width="58" height="6" fill="url(#frameGrad)" stroke="#111111" stroke-width="1.5" />
  <line x1="48" y1="57" x2="56" y2="57" stroke="#111111" stroke-width="2" />
  
  <rect x="60" y="54" width="60" height="6" fill="url(#frameGrad)" stroke="#111111" stroke-width="1.5" />
  <line x1="110" y1="57" x2="118" y2="57" stroke="#111111" stroke-width="2" />
  
  <rect x="120" y="54" width="58" height="6" fill="url(#frameGrad)" stroke="#111111" stroke-width="1.5" />
  <line x1="124" y1="57" x2="132" y2="57" stroke="#111111" stroke-width="2" />
</svg>
