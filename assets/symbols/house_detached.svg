<svg width="160" height="120" viewBox="0 0 160 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Porch / Entrance steps -->
  <rect x="60" y="100" width="40" height="20" fill="#e5e5e5" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="106" x2="100" y2="106" stroke="#111" stroke-width="1"/>
  <line x1="60" y1="113" x2="100" y2="113" stroke="#111" stroke-width="1"/>
  
  <!-- Main House Outline -->
  <rect x="10" y="10" width="140" height="90" fill="none" stroke="#111" stroke-width="2"/>
  
  <!-- Hipped Roof Ridge -->
  <line x1="45" y1="55" x2="115" y2="55" stroke="#111" stroke-width="2"/>
  
  <!-- Hipped roof corner lines -->
  <line x1="10" y1="10" x2="45" y2="55" stroke="#111" stroke-width="1.5"/>
  <line x1="10" y1="100" x2="45" y2="55" stroke="#111" stroke-width="1.5"/>
  <line x1="150" y1="10" x2="115" y2="55" stroke="#111" stroke-width="1.5"/>
  <line x1="150" y1="100" x2="115" y2="55" stroke="#111" stroke-width="1.5"/>
  
  <!-- Chimney -->
  <rect x="25" y="25" width="14" height="14" fill="#f0f0f0" stroke="#111" stroke-width="1.5"/>
  <rect x="28" y="28" width="8" height="8" fill="#444" />
</svg>
