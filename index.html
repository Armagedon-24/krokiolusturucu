<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Yazı tipleri artık tamamen yerel: src/offline-fonts.css (offline kullanım) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-512.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Polis Kriminal Laboratuvarı - Olay Yeri Kroki Oluşturma Sistemi" />
    <meta name="theme-color" content="#1e293b" />
    <meta property="og:title" content="Kroki Oluşturucu - Olay Yeri Dokümantasyon" />
    <meta property="og:description" content="Polis Kriminal Laboratuvarı - Olay Yeri Kroki Oluşturma Sistemi" />
    <meta property="og:image" content="/logo.png" />
    <title>Kroki Oluşturucu - Olay Yeri Dokümantasyon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Anti-Copy and Anti-Inspect Security Script
      document.addEventListener('contextmenu', event => event.preventDefault());
      document.onkeydown = function(e) {
        if(e.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
      };
      
      // Prevent drag and drop of files if needed
      window.addEventListener("dragover",function(e){ e.preventDefault(); },false);
      window.addEventListener("drop",function(e){ e.preventDefault(); },false);
    </script>
  </body>
</html>
